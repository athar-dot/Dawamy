    <script>
      (function() {
        var isCrossFrameError = function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || String(e || '');
          return msg.indexOf("Failed to read a named property '$$typeof' from 'Window'") !== -1 ||
                 msg.indexOf('Blocked a frame with origin') !== -1 ||
                 msg.indexOf('cross-origin frame') !== -1 ||
                 msg.indexOf('Should not already be working') !== -1;
        };
        window.addEventListener('error', function(event) {
          if (isCrossFrameError(event)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (isCrossFrameError(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
